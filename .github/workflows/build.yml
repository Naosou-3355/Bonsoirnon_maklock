name: Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Debug
        run: |
          set -o pipefail
          xcodebuild build \
            -project MakLock.xcodeproj \
            -scheme MakLock \
            -destination 'platform=macOS' \
            -configuration Debug \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project MakLock.xcodeproj \
            -scheme MakLock \
            -destination 'platform=macOS' \
            -configuration Release \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
